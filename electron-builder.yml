appId: local.claude-manager
productName: Claude Manager
copyright: Copyright © 2026 Connor Breuer

directories:
  output: release/${version}
  buildResources: build

# Use the Electron build from node_modules instead of downloading it again.
electronDist: node_modules/electron/dist

files:
  - out/**
  - package.json
  # Native sources, debug symbols and other platforms are not needed at runtime.
  - '!**/*.{pdb,map}'
  - '!node_modules/node-pty/{src,deps,third_party,scripts,binding.gyp}'
  - '!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}'
  - '!node_modules/koffi/{doc,vendor,cnoke.cjs,CHANGELOG.md}'

asar: true
# Native modules (.node), the ConPTY helpers and node-pty's worker script must live on disk.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/koffi/**
  - node_modules/@koromix/**

# Cookies on disk encrypted like Chrome's (DPAPI, the keyring on Linux): the browser's logins.
# One way only: turned off again, the encrypted cookies can't be read any more.
electronFuses:
  enableCookieEncryption: true
  # The app can't be made to run other code through the environment or a debugger: NODE_OPTIONS
  # (e.g. --require) and --inspect are ignored, and it only starts from its own app.asar. Running
  # as Node stays, the app asks the login shell for its environment with it (Linux).
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

# node-pty and koffi use Node-API, so nothing has to be compiled for Electron: Windows takes the
# prebuilds, on Linux `npm ci` compiles node-pty once for Node, which Electron loads as well.
npmRebuild: false

# Where the installed app looks for updates (electron-updater reads it from app-update.yml).
# Releases are published by semantic-release (release.config.mjs), the build itself never publishes.
publish:
  provider: github
  owner: qzconnor
  repo: claude-manager

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # The `cm` command line launcher (npm run build:launcher), registered by build/installer.nsh.
  extraFiles:
    - from: build/bin
      to: bin
      filter:
        - cm.exe
  # The icon in the notification area (src/main/window/tray.ts).
  extraResources:
    - from: build/icon.ico
      to: icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Claude Manager
  artifactName: Claude-Manager-${version}-Setup.${ext}
  include: build/installer.nsh

# Linux: an AppImage for every distribution (updates itself without a password) and packages for
# Debian/Ubuntu and Fedora/openSUSE (updated by the package manager). The `cm` command and the start
# at login are set up by the app itself (src/main/cli/command-integration.ts, src/main/lib/login-item.ts).
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icon.png
  executableName: claude-manager
  # The .desktop file is named after `desktopName` in package.json, which Electron uses as the window's
  # app_id / WM_CLASS: the desktop shows the app's icon and groups its windows with the launcher.
  syncDesktopName: true
  category: Development
  synopsis: Claude-Code-Terminals, Accounts, Sessions und Usage an einem Ort
  description: Verwaltet mehrere Claude-Code-Terminals in Tabs, mehrere Accounts, eine durchsuchbare Session-Liste und die Usage der Plan-Limits.
  maintainer: Connor Breuer
  vendor: Connor Breuer
  desktop:
    entry:
      Keywords: claude;claude code;terminal;ai;
  files:
    # Linux has no node-pty prebuilds: `npm ci` compiles it, only the module itself is needed.
    - '!node_modules/node-pty/prebuilds/**'
    - '!node_modules/node-pty/build/{Makefile,config.gypi,*.mk,node_gyp_bins}'
    - '!node_modules/node-pty/build/Release/{obj.target,.deps}'
    # koffi only calls Windows APIs (window material, bringing the window to the front).
    - '!node_modules/koffi/**'
    - '!node_modules/@koromix/**'
  # The icon in the notification area and of the window (src/main/window/tray.ts).
  extraResources:
    - from: build/icon.png
      to: icon.png

# The static AppImage runtime: runs without libfuse2, which e.g. Ubuntu 24.04 no longer installs.
toolsets:
  appimage: '1.0.3'

appImage:
  artifactName: Claude-Manager-${version}.${ext}

deb:
  artifactName: Claude-Manager-${version}.${ext}
  # electron-builder's list plus what Chromium loads besides (graphics buffers, audio). Since Ubuntu
  # 24.04 and Debian 13 the libraries are called …t64; the old names are only virtual packages there,
  # and for libasound2 apt would otherwise pick an OSS emulation that Electron can't start with.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2

rpm:
  artifactName: Claude-Manager-${version}.${ext}
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - (mesa-libgbm or libgbm1)
    - (alsa-lib or libasound2)
