# Checks every pull request: the unit tests on Windows and Linux, then the same builds as the
# release (typecheck included, without publishing), so a broken installer or package never reaches master.
name: CI

on:
  pull_request:

jobs:
  build:
    name: Windows-Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:build

  linux:
    name: Linux-Build
    runs-on: ubuntu-latest
    # Like the release: built on Debian 12, so node-pty doesn't need a newer glibc than common distributions have.
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # rpmbuild for the rpm package.
      - run: apt-get update && apt-get install -y rpm
      # node-pty has no Linux prebuilds and is compiled here.
      - run: npm ci
      - run: npm test
      - run: npm run release:build:linux
      - run: bash scripts/check-linux-glibc.sh release
