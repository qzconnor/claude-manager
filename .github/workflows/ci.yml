# Checks every pull request: the same build as the release (typecheck included, without
# publishing), so a broken installer never reaches master.
name: CI

on:
  pull_request:

jobs:
  build:
    name: Windows-Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:build
