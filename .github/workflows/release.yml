# Every push to master: semantic-release decides the next version from the commits. The Windows
# installer and the Linux packages are built with it, each on its own system (node-pty is native),
# and semantic-release publishes them together as one GitHub release – the apps update themselves from there.
name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Only semantic-release is needed here, not Electron or node-pty.
      - run: npm ci --ignore-scripts
      # The dry run only decides the version (release.config.mjs writes it to .release-version), without
      # a release-worthy commit there is none and nothing is built.
      - id: next
        run: |
          npx semantic-release --dry-run
          if [ -f .release-version ]; then echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows-Build
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # postinstall downloads the Electron binary; cm.exe is built with the .NET Framework's csc.
      - run: npm ci
      # The version in package.json stays unchanged in the repository, only the build gets the new one.
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*/Claude-Manager-*-Setup.exe
            release/*/Claude-Manager-*-Setup.exe.blockmap
            release/*/latest.yml
          if-no-files-found: error

  linux:
    name: Linux-Build
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    # node-pty is compiled here and links against the system's glibc. Built on the runner itself
    # (ubuntu-latest is Ubuntu 26.04 now), it needed glibc 2.42, and v1.16.0 didn't start on Ubuntu 24.04,
    # Debian 13 or Fedora 42. Debian 12 has glibc 2.36, the module then runs from Ubuntu 22.04 on (checked below).
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # rpmbuild for the rpm package; deb and AppImage need nothing beyond the image.
      - run: apt-get update && apt-get install -y rpm
      # postinstall downloads the Electron binary; node-pty has no Linux prebuilds and is compiled here.
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run release:build:linux
      - run: bash scripts/check-linux-glibc.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*/Claude-Manager-*.AppImage
            release/*/Claude-Manager-*.deb
            release/*/Claude-Manager-*.rpm
            release/*/latest-linux.yml
          if-no-files-found: error

  release:
    name: Release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Where release.config.mjs looks for the assets, as if they had been built here. The artifacts
      # already contain the version folder (upload-artifact keeps everything after `release/`).
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      # semantic-release only warns about a missing asset and publishes the release without it.
      - name: Check the assets
        run: ls -l release/${{ needs.version.outputs.version }}/{Claude-Manager-*-Setup.exe,Claude-Manager-*-Setup.exe.blockmap,latest.yml,Claude-Manager-*.AppImage,Claude-Manager-*.deb,Claude-Manager-*.rpm,latest-linux.yml}
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
